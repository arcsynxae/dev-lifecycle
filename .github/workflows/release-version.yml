name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Changesets Version PR & Clean Plugin Artifact
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest version consistency
        run: npm run version:check

      - name: Run verification test suites
        run: npm test

      - name: Create or update Changesets Version PR (syncs package.json, plugin.json & CHANGELOG.md)
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          title: "chore(release): version plugin"
          commit: "chore(release): version plugin"
          commitMode: "git-cli"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build clean runtime-only plugin distribution archive
        run: npm run package:plugin

      - name: Upload clean runtime plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: dev-lifecycle-release-bundle
          path: dist/dev-lifecycle-v*.zip
          if-no-files-found: error
