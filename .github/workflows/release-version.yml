name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Changesets Version PR & Clean Plugin Artifact
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest version consistency
        run: npm run version:check

      - name: Create or update Changesets Version PR (syncs package.json, plugin.json & CHANGELOG.md)
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          pr-title: "chore(release): version plugin"
          commit-message: "chore(release): version plugin"
          create-github-releases: false
          push-git-tags: false
          push-with-git-cli: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build clean runtime-only plugin distribution archive
        run: npm run package:plugin

      - name: Upload clean runtime plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: dev-lifecycle-release-bundle
          path: dist/dev-lifecycle-v*.zip
          if-no-files-found: error
