name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Validate, Test & Package Clean Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest version consistency (package.json === plugin.json)
        run: npm run version:check

      - name: Run full DevLifecycle verification suite (45 scenarios)
        run: npm test

      - name: Stage and validate clean runtime plugin distribution
        run: npm run package:plugin

      - name: Upload clean runtime plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: dev-lifecycle-clean-plugin
          path: dist/dev-lifecycle-v*.zip
          if-no-files-found: error
